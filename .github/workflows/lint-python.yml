name: Python Lint

on:
  pull_request:
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'requirements*.txt'

jobs:
  ruff:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint (naming, type hints, style)
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .

  pytest:
    name: Tests
    runs-on: ubuntu-latest
    if: hashFiles('tests/') != ''
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt 2>/dev/null || true
          pip install pytest

      - name: Run tests
        run: pytest tests/ -v
