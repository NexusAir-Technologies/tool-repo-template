name: Commit Lint

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        run: |
          COMMITS=$(git log --format='%s' --no-merges origin/${{ github.base_ref }}..HEAD)
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?(!)?: .{1,72}$'
          FAILED=0

          while IFS= read -r msg; do
            if [ -z "$msg" ]; then continue; fi
            if ! echo "$msg" | grep -qE "$PATTERN"; then
              echo "::error::Invalid commit message: '$msg'"
              echo "  Expected: type(scope): description"
              echo "  Types: feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert"
              FAILED=1
            else
              echo "OK: $msg"
            fi
          done <<< "$COMMITS"

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "::error::Some commits do not follow Conventional Commits format."
            echo "See: docs/coding-standards.md#九git-提交规范"
            exit 1
          fi
