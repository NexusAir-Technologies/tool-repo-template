name: C/C++ Lint

on:
  pull_request:
    paths:
      - '**.c'
      - '**.cpp'
      - '**.h'
      - '**.hpp'
      - '.clang-format'
      - '.clang-tidy'

jobs:
  clang-format:
    name: Code Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run clang-format check
        uses: jidicula/clang-format-action@v4.14.0
        with:
          clang-format-version: '17'
          check-path: 'src'

  clang-tidy:
    name: Naming & Safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-17
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-17 100

      - name: Run clang-tidy
        run: |
          find src/ -name '*.cpp' -o -name '*.c' | head -200 | while read file; do
            echo "Checking: $file"
            clang-tidy "$file" \
              --config-file=.clang-tidy \
              --warnings-as-errors='readability-identifier-naming,misc-no-recursion' \
              -- -std=c++17 -Isrc/ 2>&1 || exit 1
          done

  cppcheck:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck --enable=warning,style,performance \
            --suppress=missingIncludeSystem \
            --error-exitcode=1 \
            --inline-suppr \
            -I src/ \
            src/
